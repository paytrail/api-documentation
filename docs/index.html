<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Paytrail Payment API</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Paytrail API documentation for developers." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <meta property="og:image" content="https://docs.paytrail.com/images/paytrail-api-documentation.png">
    <link rel="icon" href="/images/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/images/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="/images/favicon.ico" sizes="any">

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&amp;family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css" />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav>
      <a href="#/">Home</a>
      <a href="#/examples">Examples</a>
      <a href="#/payment-method-providers">Providers</a>
      <a href="#/shop-in-shop">Shop-in-Shop Guidelines</a>
      <a href="#/reseller-api">Reseller API</a>
    </nav>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@9/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
    <script>
      var num = 0;
      mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        themeVariables: { primaryColor: '#f7f7f8', primaryBorderColor: '#e4e4e5', noteBkgColor: '#ffe7f2' },

        sequence: {
          useMaxWidth: true,
          fontFamily: '"Source Sans 3", Helvetica, Arial, sans-serif',
        },
      });

      // Section labels shown above top-level sidebar items, keyed by page route.
      // Each group starts at the heading with the given id and runs until the next group.
      var sidebarGroups = {
        '/': [
          { label: 'Getting started', start: 'api-endpoint' },
          { label: 'Payments', start: 'payments' },
          { label: 'Payment methods', start: 'apple-pay' },
          { label: 'Reports & settlements', start: 'payment-reports' },
          { label: 'Reference', start: 'merchants' },
        ],
      };

      // Restructures the auto-generated sidebar: hides the page title, nests sub-items
      // inside their parent so they can be collapsed, and adds group labels.
      function sidebarNavPlugin(hook, vm) {
        hook.doneEach(function () {
          var root = document.querySelector('.sidebar-nav > ul');
          if (!root || root.dataset.enhanced) {
            return;
          }
          root.dataset.enhanced = 'true';

          // A single page title (h1) wrapping everything is redundant in the sidebar
          var title = root.firstElementChild;
          var titleChildren = title && title.nextElementSibling;
          if (root.children.length === 2 && titleChildren && titleChildren.tagName === 'UL') {
            while (titleChildren.firstChild) {
              root.appendChild(titleChildren.firstChild);
            }
            title.remove();
            titleChildren.remove();
          }

          Array.prototype.slice.call(root.children).forEach(function (li) {
            var children = li.nextElementSibling;
            if (li.tagName !== 'LI' || !children || children.tagName !== 'UL') {
              return;
            }
            li.classList.add('has-children');
            li.appendChild(children);

            var toggle = document.createElement('button');
            toggle.className = 'sidebar-toggle-children';
            toggle.setAttribute('aria-label', 'Toggle ' + li.firstElementChild.textContent);
            toggle.addEventListener('click', function () {
              var expanded = isExpanded(li);
              li.classList.toggle('open', !expanded);
              li.classList.toggle('closed', expanded);
            });
            li.insertBefore(toggle, children);

            li.firstElementChild.addEventListener('click', function () {
              li.classList.remove('closed');
              li.classList.add('open');
            });
          });

          (sidebarGroups[vm.route.path] || []).forEach(function (group) {
            var link = root.querySelector(':scope > li > a[href$="?id=' + group.start + '"]');
            if (!link) {
              return;
            }
            var label = document.createElement('li');
            label.className = 'sidebar-group-label';
            label.textContent = group.label;
            root.insertBefore(label, link.parentNode);
          });
        });

        function isExpanded(li) {
          return getComputedStyle(li.querySelector(':scope > ul')).display !== 'none';
        }
      }

      window.$docsify = {
        name: '',
        repo: 'paytrail/api-documentation',
        maxLevel: 3,
        subMaxLevel: 3,
        themeColor: '#e60094',
        name: 'Paytrail Payment API',
        name: '<img src="/images/paytrail-logo.svg" />API Docs',
        plugins: [sidebarNavPlugin],

        markdown: {
          renderer: {
            code: function (code, lang) {
              if (lang === 'mermaid') {
                return '<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + '</div>';
              }
              return this.origin.code.apply(this, arguments);
            },
          },
        },
      };
    </script>
  </body>
</html>
